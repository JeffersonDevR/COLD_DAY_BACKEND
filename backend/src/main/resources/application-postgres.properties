# Perfil PostgreSQL/PostGIS: se combina con el que corresponda, ej.
#   .\gradlew bootRun --args="--spring.profiles.active=prod,postgres"
# Defaults alineados al contenedor local "coldday-postgis"
# (postgis/postgis:16-3.4 en localhost:5433, DB/user/password = cold_day).
# Sobrescribe con POSTGRES_URL / POSTGRES_USER / POSTGRES_PASSWORD.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/cold_day}
spring.datasource.username=${POSTGRES_USER:cold_day}
spring.datasource.password=${POSTGRES_PASSWORD:cold_day}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update (no create-drop): Hibernate ajusta el esquema a partir de las entidades
# pero ya no borra las tablas en cada arranque/parada, así los datos persisten
# entre reinicios de la app.
spring.jpa.hibernate.ddl-auto=update
# Los scripts deben correr DESPUES de que Hibernate cree las tablas, porque
# schema-postgres.sql crea la extension PostGIS y el indice GiST sobre tecnico.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgres.sql
