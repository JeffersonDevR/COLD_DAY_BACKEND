# ===========================================================================
# Perfil de DESARROLLO LOCAL (perfil por defecto).
#   .\gradlew bootRun
# Requiere el contenedor local "coldday-postgis" (postgis/postgis:16-3.4,
# localhost:5433). Cada valor se puede sobrescribir por variable de entorno o
# en backend/.env (ver .env.example).
# ===========================================================================

# --- Base de datos -----------------------------------------------------------
# Defaults alineados al contenedor local: DB/usuario/password = cold_day.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/cold_day}
spring.datasource.username=${POSTGRES_USER:cold_day}
spring.datasource.password=${POSTGRES_PASSWORD:cold_day}

# Pool del datasource
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Mostrar el SQL de Hibernate solo cuando se este depurando una consulta:
# cambia a true (o pasa SPRING_JPA_SHOW_SQL=true).
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Seguridad ---------------------------------------------------------------
# Secreto de desarrollo (minimo 32 bytes). NUNCA usar este valor en prod.
app.jwt.secret=${JWT_SECRET:cold-day-dev-secret-key-change-me-32-bytes !!}

# Dev server de Angular.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Autenticacion APAGADA en local: las peticiones sin JWT se ejecutan como un
# usuario sembrado (ver DevAuthBypassFilter). Por defecto el admin; para actuar
# como otro usuario envia el header  X-Dev-Usuario: cliente1@coldday.com.co
# (tecnico1@..., proveedor1@..., contable@...). Un JWT valido tiene prioridad.
# Para probar la autenticacion real: DEV_AUTH_BYPASS=false en backend/.env.
# El arranque falla si esto queda activo con el perfil prod.
app.security.dev-bypass.enabled=${DEV_AUTH_BYPASS:true}
app.security.dev-bypass.correo=${DEV_AUTH_CORREO:admin@coldday.com.co}

# --- Swagger/OpenAPI ---------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# --- Datos de demostracion ---------------------------------------------------
# Siempre activos en local.
app.seed.enabled=true

# --- Logs y errores ----------------------------------------------------------
# Logs utiles para seguir el flujo de despacho sin ahogarse en ruido de Spring.
logging.level.com.sena.cold_day=DEBUG

# Errores con detalle para el frontend en desarrollo (nunca en prod).
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
