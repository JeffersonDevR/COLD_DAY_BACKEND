spring.application.name=cold_day

# Carga el archivo backend/.env (formato KEY=valor) si existe. Sin él, Spring
# usa las variables de entorno del sistema. Ver backend/.env.example.
spring.config.import=optional:file:.env[.properties]

# JPA/H2 configuration used by the local and test profile.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Initialize schema on startup. Hibernate create-drop is the schema authority for
# H2 dev/test; schema.sql is the canonical mirror and runs BEFORE JPA (D8), so
# `CREATE TABLE IF NOT EXISTS` stays a no-op for entity-managed tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

app.jwt.secret=${JWT_SECRET:cold-day-dev-secret-key-change-me-32-bytes !!}
app.jwt.expiracion-ms=3600000

# Google Maps Platform (server key). La clave real vive en backend/.env
# (GOOGLE_MAPS_API_KEY) o como variable de entorno; aquí solo el mapeo.
# Con enabled=false los endpoints /api/maps/* responden 503 sin consumir cuota.
app.maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.maps.enabled=${GOOGLE_MAPS_ENABLED:true}
app.maps.language=es
app.maps.region=CO
app.maps.timeout-ms=4000

# Liquidacion operativa (RF-F1-23): comision de intermediacion sobre el cobro en
# efectivo/transferencia registrado por el tecnico (tanto por uno, 0.15 = 15%).
app.liquidacion.comision-porcentaje=${LIQUIDACION_COMISION:0.15}

# Seed de datos de demostración (5 clientes + 5 técnicos) para observar el flujo
# de mapas/geolocalización contra la API real. Desactivar con APP_SEED_ENABLED=false.
app.seed.enabled=${APP_SEED_ENABLED:true}


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs