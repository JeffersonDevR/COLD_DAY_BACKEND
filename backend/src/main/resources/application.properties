# ===========================================================================
# Configuracion COMUN a todos los perfiles.
#   dev  -> application-dev.properties   (local: BD local, logs y errores detallados)
#   prod -> application-prod.properties  (Render: todo lo sensible por variable de entorno)
# Aqui solo va lo que no cambia entre entornos; lo que cambia vive en el perfil.
# ===========================================================================

# Perfil por defecto. Una variable de entorno o argumento lo sobrescribe:
#   SPRING_PROFILES_ACTIVE=prod  |  --spring.profiles.active=prod
# El Dockerfile fija prod, asi que un contenedor nunca arranca en dev por descuido.
spring.profiles.active=dev

spring.application.name=cold_day
server.port=${PORT:8090}

# Carga el archivo backend/.env (formato KEY=valor) si existe. Sin él, Spring
# usa las variables de entorno del sistema. Ver backend/.env.example.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Base de datos y esquema (PostgreSQL/PostGIS: unico motor en dev, test y prod)
# ---------------------------------------------------------------------------
# La URL y las credenciales van en cada perfil. Los tests no usan esa base:
# levantan su propio contenedor con Testcontainers.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# El esquema lo gestiona Flyway (ver db/migration). ddl-auto=validate solo
# compara tablas/columnas/tipo/nulabilidad contra lo que Flyway ya aplico y falla
# rapido en el arranque si no coinciden - nunca emite DDL contra Postgres.
spring.jpa.hibernate.ddl-auto=validate
# baseline-on-migrate + baseline-version=1 permite adoptar Flyway sobre una base
# que ya tiene el esquema (creado antes por ddl-auto=update): se autobaseliza en
# la version 1 sin ejecutar V1 (que solo corre contra una Postgres nueva/vacia) y
# aplica de verdad cualquier migracion > 1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema preexistente antes de Flyway
# Flyway es la unica via de inicializacion de esquema: no se ejecuta schema.sql.
spring.sql.init.mode=never

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.sena.cold_day=INFO

# ---------------------------------------------------------------------------
# Seguridad / JWT
# ---------------------------------------------------------------------------
# El secreto (app.jwt.secret) y los origenes CORS (app.cors.allowed-origins) van
# en cada perfil: dev con valores locales, prod exigidos por variable de entorno.
app.jwt.expiracion-ms=3600000

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
# Solo health e info por HTTP (SecurityConfig solo abre /actuator/health).
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------
# OpenAPI / Swagger
# ---------------------------------------------------------------------------
# Rutas comunes; springdoc.*.enabled se define por perfil (prod lo apaga).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Google Maps Platform (server key). La clave real vive en backend/.env
# (GOOGLE_MAPS_API_KEY) o como variable de entorno; aquí solo el mapeo.
# Con enabled=false los endpoints /api/maps/* responden 503 sin consumir cuota.
# ---------------------------------------------------------------------------
app.maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.maps.enabled=${GOOGLE_MAPS_ENABLED:true}
app.maps.language=es
app.maps.region=CO
app.maps.timeout-ms=4000

# ---------------------------------------------------------------------------
# Reglas de negocio configurables
# ---------------------------------------------------------------------------
# Liquidacion (RF-F1-23): comision de intermediacion sobre el cobro en
# efectivo/transferencia registrado por el tecnico (tanto por uno, 0.15 = 15%).
app.liquidacion.comision-porcentaje=${LIQUIDACION_COMISION:0.15}

# Despacho de OT: frecuencia del barrido que escala el radio de busqueda de
# tecnicos cuando vence la ventana de oferta (ver ProgramadorEscalamientoOt).
app.dispatch.escalamiento-ms=${DISPATCH_ESCALAMIENTO_MS:5000}

# Vigencia documental: cron del barrido diario que suspende tecnicos con
# documentos/certificaciones vencidas (ver ProgramadorVigencia).
app.vigencia.cron=${VIGENCIA_CRON:0 0 6 * * *}

# Tarifa de visita: precio por distancia calculado en el backend. Los
# parametros viven solo en configuracion (la formula y los tramos no se
# persisten), asi que cambiar el precio no requiere migracion. Los tramos
# (brackets) usan los defaults declarados en TarifaProperties.
app.tarifa.base=${TARIFA_BASE:30000}
app.tarifa.radio-metropolitano-km=${TARIFA_RADIO_METROPOLITANO_KM:8.0}
app.tarifa.radio-max-km=${TARIFA_RADIO_MAX_KM:30.0}
app.tarifa.precio-max=${TARIFA_PRECIO_MAX:80000}
app.tarifa.redondeo-cop=${TARIFA_REDONDEO_COP:100}
app.tarifa.centro-lat=${TARIFA_CENTRO_LAT:7.8939}
app.tarifa.centro-lng=${TARIFA_CENTRO_LNG:-72.5078}

# Auxiliares: maximo declarable al aceptar una oferta. Los auxiliares son un
# conteo (sin identidad, cuentas ni pagos) y nunca se cobran; el maximo es
# configurable, no un literal hardcodeado, y se valida en AceptarOfertaUseCase
# antes de cualquier escritura.
app.auxiliares.max=${AUXILIARES_MAX:10}

# Despacho de insumos: ventana server-authoritative de cada solicitud/oferta y
# frecuencia del barrido que expira ofertas vencidas y resuelve solicitudes sin
# proveedor (ver ProgramadorExpiracionInsumo). El vencimiento vive en la fila,
# no en el transporte, asi que sobrevive reinicios.
app.insumos.vigencia-ms=${INSUMOS_VIGENCIA_MS:900000}
app.insumos.barrido-ms=${INSUMOS_BARRIDO_MS:60000}

# ---------------------------------------------------------------------------
# Datos de demostracion (DevDataSeeder)
# ---------------------------------------------------------------------------
# Password de los usuarios sembrados en local/demo. Configurable por entorno;
# el valor por defecto solo aplica cuando el seed esta habilitado.
# app.seed.enabled se define por perfil: dev lo activa, prod lo apaga.
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:demo1234}
