spring.application.name=cold_day

# JPA/H2 configuration used by the local and test profile.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Initialize schema on startup
spring.sql.init.mode=always

# JWT signing (never hardcode the real secret; use JWT_SECRET env var in production)
app.jwt.secret=${JWT_SECRET:cold-day-dev-secret-key-change-me-32-bytes !!}
app.jwt.expiracion-ms=3600000
