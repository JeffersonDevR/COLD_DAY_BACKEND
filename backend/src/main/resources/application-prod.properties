# Perfil productivo: hereda todo de application.properties excepto el secreto JWT.
# Sin valor por defecto a proposito: si JWT_SECRET no esta definida, Spring falla
# en el arranque ("Could not resolve placeholder 'JWT_SECRET'") en vez de firmar
# tokens con una clave debil/conocida.
#
# Arranque prod (PowerShell):
#   $env:JWT_SECRET = "<secreto-aleatorio-de-minimo-32-bytes>"
#   .\gradlew bootRun --args="--spring.profiles.active=prod"
# Generar secreto (PowerShell):
#   [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Max 256 }))
app.jwt.secret=${JWT_SECRET}

# Google Maps en prod: misma variable que en dev. Si no se define,
# /api/maps/* responde 503 (ver MapsControllerAdvice) en vez de romper el arranque.
# Arranque prod (PowerShell):
#   $env:GOOGLE_MAPS_API_KEY = "<server-key-restringida-por-IP>"
#   $env:GOOGLE_MAPS_ENABLED = "true"
