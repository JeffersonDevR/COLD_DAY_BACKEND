# ===========================================================================
# Perfil de PRODUCCION (Render). Se activa con SPRING_PROFILES_ACTIVE=prod
# (el Dockerfile ya lo fija). Hereda lo comun de application.properties.
#
# Todo lo sensible se exige por variable de entorno SIN valor por defecto a
# proposito: si falta, Spring falla en el arranque ("Could not resolve
# placeholder ...") en vez de correr con credenciales debiles o conocidas.
#
# Variables obligatorias:
#   JWT_SECRET            secreto aleatorio de minimo 32 bytes
#   POSTGRES_URL          jdbc:postgresql://host:5432/db  (formato JDBC, no postgres://)
#   POSTGRES_USER
#   POSTGRES_PASSWORD
#   CORS_ALLOWED_ORIGINS  ej. https://cold-day.onrender.com,https://www.coldday.co
# Opcionales:
#   PORT (lo inyecta Render), GOOGLE_MAPS_API_KEY, GOOGLE_MAPS_ENABLED,
#   APP_SEED_ENABLED, DB_POOL_MAX, LOG_LEVEL, FORWARD_HEADERS_STRATEGY,
#   RATE_LIMIT_AUTH_MAX, RATE_LIMIT_AUTH_WINDOW, RATE_LIMIT_AUTH_ENABLED
#
# Arranque prod local (PowerShell):
#   $env:JWT_SECRET = "<secreto>"; $env:POSTGRES_URL = "jdbc:postgresql://..."
#   .\gradlew bootRun --args="--spring.profiles.active=prod"
# Generar secreto (PowerShell):
#   [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Max 256 }))
# ===========================================================================

# --- Red ---------------------------------------------------------------------
# Render inyecta el puerto via PORT; localmente cae en 8090.
server.port=${PORT:8090}
server.address=0.0.0.0
# Render termina TLS en su proxy: respeta X-Forwarded-* para esquema/host reales.
# NATIVE hace que Tomcat (RemoteIpValve) reescriba getRemoteAddr() con la IP
# del cliente que fija el proxy. Es la unica via por la que el rate limit de
# auth ve la IP real: el filtro NO lee X-Forwarded-For a mano porque ese header
# es falsificable por el cliente y saltaria el cupo.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NATIVE}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Base de datos -----------------------------------------------------------
# Sin fallback: las credenciales deben venir del entorno.
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Pool del datasource. El plan gratuito de Postgres en Render tiene pocas
# conexiones simultaneas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Seguridad ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}

# Origenes del frontend, separados por coma, sin "/" final. Sin valor por
# defecto: si falta, el arranque falla en vez de abrir CORS por accidente.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Swagger/OpenAPI ---------------------------------------------------------
# No se expone en produccion (responde 404).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Datos de demostracion ---------------------------------------------------
# Apagado por defecto: el seeder crea usuarios con password conocida. Activalo
# solo para una demo controlada con APP_SEED_ENABLED=true (y cambia
# APP_SEED_DEMO_PASSWORD).
app.seed.enabled=${APP_SEED_ENABLED:false}

# --- Logs, errores y actuator -------------------------------------------------
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.sena.cold_day=INFO

spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
management.endpoint.health.show-details=never

# --- Google Maps -------------------------------------------------------------
# Misma variable que en dev (mapeo en application.properties). Si no se define,
# /api/maps/* responde 503 (ver MapsControllerAdvice) en vez de romper el arranque.
#   $env:GOOGLE_MAPS_API_KEY = "<server-key-restringida-por-IP>"
#   $env:GOOGLE_MAPS_ENABLED = "true"
