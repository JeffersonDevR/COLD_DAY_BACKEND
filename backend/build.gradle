plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "7.3.1.8318"
}
sonar {
	properties {
		property "sonar.projectKey", "Cold-day-backend"
		property "sonar.host.url", "http://localhost:9000"
		// El codigo de test no se audita para issues (mismo criterio que el
		// frontend, que excluye *.spec.ts); su cobertura si cuenta via JaCoCo.
		property "sonar.test.exclusions", "src/test/**"
	}
}

group = 'com.sena'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Required to serialize/deserialize LocalDateTime in JSON arrays
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Cache acotada y con expiracion para el rate limit de auth
    // (RateLimitFilter). Sin version explicita: la gestiona el BOM de Spring
    // Boot (respalda spring-boot-starter-cache).
    implementation 'com.github.ben-manes.caffeine:caffeine'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	// Gestiona el esquema (ver db/migration).
	// Spring Boot 4 modulariza la autoconfiguracion por tecnologia (ver
	// spring-boot-jdbc, spring-boot-hibernate, etc. en el classpath): el glue
	// de Flyway con Spring Boot vive en spring-boot-flyway, no basta con la
	// libreria flyway-core sola como en Boot 2/3.
	runtimeOnly 'org.springframework.boot:spring-boot-flyway'
	runtimeOnly 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testCompileOnly 'org.projectlombok:lombok'
	// Los tests corren contra un PostgreSQL/PostGIS real levantado con Docker
	// (ver PostgisContainerInitializer): no hay base embebida.
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
}

tasks.named('test') {
	useJUnitPlatform()
	// Los tests crean sus propios datos; el seed de demo solo aplica a ejecución local.
	systemProperty 'app.seed.enabled', 'false'
	// Los tests de seguridad esperan la autenticacion real (401/403).
	systemProperty 'app.security.dev-bypass.enabled', 'false'
	// Los tests usan el contenedor de Testcontainers, no una base embebida.
	systemProperty 'spring.test.database.replace', 'none'
	// Los barridos programados se invocan directamente en los tests. Con varios
	// contextos Spring cacheados compartiendo la misma base de datos, un
	// tick del scheduler ajeno expira filas a mitad de un test (ver CRITICAL-1 de
	// la verificación). Empujar ambos delays fuera de la ventana de test mantiene
	// los barridos deterministas sin tocar el producto.
	systemProperty 'app.insumos.barrido-ms', '3600000'
	systemProperty 'app.dispatch.escalamiento-ms', '3600000'
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}
