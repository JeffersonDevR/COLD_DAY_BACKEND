# Blueprint de Render para el backend COLD DAY.
# Uso: Render Dashboard -> New -> Blueprint -> conecta este repo.
# Los valores marcados con `sync: false` se piden en el dashboard (no van al repo).
services:
  - type: web
    name: cold-day-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,postgres
      # El esquema del perfil postgres lo gestiona Flyway (db/migration/), no
      # ddl-auto: validate solo compara contra lo que Flyway ya aplico y falla
      # rapido en el arranque si no coincide, sin emitir DDL. Ver ARQUITECTURA.md #14.
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: JWT_SECRET
        sync: false
      # Origenes exactos del frontend (web + esquemas nativos de Capacitor). Sin
      # valor por defecto en application-prod.properties: si falta, el arranque
      # falla a proposito. El blueprint debe declararlo o el primer deploy no
      # levanta.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Base del enlace de recuperacion de contrasena (ej. https://www.coldday.co/recuperar).
      - key: MAIL_RESET_URL_BASE
        sync: false
      # JDBC puro SIN credenciales embebidas (el driver pgjdbc no acepta user:pass@host).
      # Ej: jdbc:postgresql://dpg-xxxx-a:5432/cold_day_db_v1  (host interno de Render)
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_ENABLED
        value: "true"
      # Server key: restringida por IP, solo la usa el backend. Nunca sale al front.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Browser key: restringida por HTTP referrer, es la unica que el backend
      # publica en GET /api/config/maps. Debe ser DISTINTA de la server key.
      - key: GOOGLE_MAPS_BROWSER_API_KEY
        sync: false

  # Landing pública (proyecto separado, estático). Ver landing/README.md.
  - type: web
    name: cold-day-landing
    runtime: static
    plan: free
    rootDir: landing
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
