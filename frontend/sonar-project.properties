# Configuracion del analisis SonarQube para el frontend.
# El token NO va aqui: se lee de SONAR_TOKEN (frontend/.env o variable de entorno)
# y lo inyecta scripts/sonar.mjs antes de invocar el scanner.
sonar.projectKey=coldday-frontend
sonar.projectName=Cold Day Frontend
sonar.host.url=http://localhost:9000

# Rutas RELATIVAS al proyecto (frontend/). El archivo de la key vive en
# src/app/core/environment/, no en src/environments/: con la ruta vieja la key real
# entraba al analisis y el scanner la subia al servidor.
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,src/app/core/environment/maps-key.ts,src/app/core/environment/api-origin.ts

# Cobertura generada por `ng test --coverage` (@vitest/coverage-v8).
sonar.javascript.lcov.reportPaths=coverage/app/lcov.info
sonar.coverage.exclusions=src/main.ts,src/environments/**,**/*.spec.ts
