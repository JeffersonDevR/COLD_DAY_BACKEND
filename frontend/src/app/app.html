<!-- Toast Host Notificaciones Flotantes -->
<app-toast-host />

@if (estaAutenticado()) {
  <!-- Shell tipo Sakai: topbar fija + sidebar colapsable + contenido -->
  <div class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans">
    <app-topbar />
    <app-sidebar />

    <div [class]="'pt-16 transition-[padding] duration-200 ' + contenidoClass()">
      <div class="min-h-[calc(100vh-4rem)] flex flex-col">
        <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
          <router-outlet />
        </main>
        <app-footer />
      </div>
    </div>
  </div>
} @else {
  <!-- Layout público (login, registro, recuperar): sin shell -->
  <router-outlet />
}
