<main class="min-h-[60vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200 p-8 text-center space-y-4">
    <i class="pi pi-mobile text-3xl text-sky-700" aria-hidden="true"></i>
    <h1 class="text-xl font-bold text-slate-900">Usa la app de Cold Day</h1>
    <p class="text-sm text-slate-700">
      Tu cuenta funciona en la app móvil. Esta web es solo para el equipo interno.
    </p>
    <button
      type="button"
      (click)="cerrarSesion()"
      class="w-full min-h-11 rounded-xl bg-sky-700 text-white text-sm font-bold hover:bg-sky-800"
    >
      Cerrar sesión
    </button>
  </div>
</main>
