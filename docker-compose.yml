services:
  db:
    image: postgis/postgis:16-3.4
    container_name: coldday-postgis
    environment:
      POSTGRES_DB: cold_day
      POSTGRES_USER: cold_day
      POSTGRES_PASSWORD: cold_day
    ports:
      - "5433:5432"
    volumes:
      - coldday-postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cold_day -d cold_day"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coldday-backend
    depends_on:
      db:
        condition: service_healthy
    # Lee backend/.env (no se commitea). Aporta JWT_SECRET, GOOGLE_MAPS_ENABLED
    # y GOOGLE_MAPS_API_KEY. `environment` tiene prioridad sobre `env_file`.
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod,postgres
      # update es el default del perfil postgres: conserva los datos entre reinicios.
      # Cambia a "create-drop" si alguna vez quieres recrear el esquema desde cero.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      # Dentro de la red de Docker la DB es el servicio `db`, no localhost.
      POSTGRES_URL: jdbc:postgresql://db:5432/cold_day
      POSTGRES_USER: cold_day
      POSTGRES_PASSWORD: cold_day
    ports:
      - "8090:8090"

volumes:
  coldday-postgis-data:
