<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Ingreso | Cold Day</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "#0b1220",
            surface: "#111b2e",
            borderLine: "#1e293b",
            primaryCyan: "#22d3ee",
            dangerRed: "#f87171"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            display: ["Space Grotesk", "sans-serif"],
            body: ["Inter", "sans-serif"],
            mono: ["Space Mono", "monospace"],
            label: ["Space Mono", "monospace"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Safe-area insets compatibility */
    .safe-top {
      padding-top: env(safe-area-inset-top, 16px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
  </style>
</head>
<body class="bg-[#0b1220] text-slate-100 font-body antialiased min-h-screen flex flex-col justify-between selection:bg-[#22d3ee]/20 selection:text-[#22d3ee] overflow-x-hidden">
<!-- Top Mobile Bar / Status Area (Safe Area Aware) -->
<header class="w-full max-w-[390px] mx-auto px-4 safe-top pt-3 flex items-center justify-between z-10">
<button aria-label="Volver" class="w-11 h-11 flex items-center justify-center text-slate-400 hover:text-white transition-colors rounded-lg active:bg-[#111b2e]" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#111b2e] border border-[#1e293b]">
<span class="w-1.5 h-1.5 rounded-full bg-[#22d3ee] animate-pulse"></span>
<span class="font-mono text-[11px] tracking-wider text-slate-400 uppercase">SISTEMA ACTIVO</span>
</div>
<div class="w-11 h-11 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-600 text-lg">shield</span>
</div>
</header>
<!-- Main Viewport Container (Centered keyboard-safe 390px canvas) -->
<main class="w-full max-w-[390px] mx-auto px-4 py-4 flex-1 flex flex-col justify-center">
<!-- Brand Identity Header -->
<div class="flex flex-col items-center text-center mb-6">
<div class="relative w-16 h-16 rounded-xl bg-[#111b2e] border border-[#1e293b] p-2 flex items-center justify-center shadow-lg mb-3">
<img alt="Cold Day Snowflake Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XiO-AxEHuaOTB8N9UX504Q9uGpTJw4XkUs1SjDl5C910wV7SQOxq_LmviLK76OnC1eQ7Qjo59Jz3DdEXhRZcvGui584K_4QL-Iv__fRFftYOqTY6jA1MCEDhruBs_UIP6pZ9nw6Z0doPNzIZPMF17oM4AieErgzqjeio4AWRwP9hpn1xsz-cmikj29jlAnwyu5fegdqYon6PmL34FpaTR69918zjmuViLU7_Ztz5G5x2SlPr0grWUxlJ4"/>
</div>
<h1 class="font-headline font-bold uppercase tracking-widest text-2xl text-white">COLD DAY</h1>
<p class="text-xs text-slate-400 mt-1 font-body">Servicio técnico oficial a domicilio</p>
</div>
<!-- Login Surface Card -->
<div class="bg-[#111b2e] border border-[#1e293b] rounded-xl p-5 shadow-2xl">
<form class="space-y-4" id="loginForm" onsubmit="event.preventDefault();">
<!-- Input: Email -->
<div>
<label class="block font-mono text-[11px] tracking-wider text-slate-400 uppercase mb-1.5" for="email">
            CORREO ELECTRÓNICO
          </label>
<div class="relative">
<input autocomplete="email" class="w-full h-12 bg-[#0b1220] border border-[#1e293b] rounded-lg px-3.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-[#22d3ee] focus:ring-1 focus:ring-[#22d3ee] transition-all font-body" id="email" placeholder="ejemplo@coldday.com.ar" required="" type="email" value="operaciones@coldday.com.ar"/>
</div>
</div>
<!-- Input: Password -->
<div>
<label class="block font-mono text-[11px] tracking-wider text-slate-400 uppercase mb-1.5" for="password">
            CONTRASEÑA
          </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 bg-[#0b1220] border border-[#1e293b] rounded-lg px-3.5 pr-11 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-[#22d3ee] focus:ring-1 focus:ring-[#22d3ee] transition-all font-body" id="password" placeholder="••••••••••••" required="" type="password" value="wrongpassword"/>
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-0 h-12 w-11 flex items-center justify-center text-slate-400 hover:text-white transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Error Banner: Compact Dark Ops Tint -->
<div class="bg-[#f87171]/10 border border-[#f87171]/25 rounded-lg py-2.5 px-3 flex items-center gap-2">
<span class="material-symbols-outlined text-[#f87171] text-[18px] shrink-0">error</span>
<span class="text-xs text-[#f87171] font-medium leading-tight">Correo o contraseña incorrectos</span>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-12 bg-[#22d3ee] hover:bg-[#06b6d4] active:scale-[0.99] text-[#0b1220] font-headline font-semibold text-sm rounded-lg shadow-[0_0_20px_rgba(34,211,238,0.25)] flex items-center justify-center gap-2 transition-all duration-150 cursor-pointer" type="submit">
<svg class="animate-spin -ml-1 mr-1 h-4 w-4 text-[#0b1220] hidden" fill="none" id="spinner" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<span>Ingresar</span>
</button>
<!-- Help Link -->
<div class="pt-1 text-center">
<a class="inline-block text-xs text-slate-400 hover:text-[#22d3ee] transition-colors py-1" href="#">
            ¿Olvidaste tu contraseña?
          </a>
</div>
<div class="border-t border-[#1e293b]/70 pt-3 text-center">
<p class="text-xs text-slate-400 font-body">
            ¿No tenés cuenta? 
            <a class="text-white font-medium hover:text-[#22d3ee] transition-colors ml-1 inline-block" href="#">
              Crear cuenta
            </a>
</p>
</div>
</form>
</div>
</main>
<!-- Pinned Operational Footer -->
<footer class="w-full max-w-[390px] mx-auto px-4 safe-bottom py-4 text-center">
<div class="flex items-center justify-center gap-1.5 text-slate-500 font-mono text-[11px] tracking-wide">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>Conexión cifrada de extremo a extremo · Argentina</span>
</div>
</footer>
<!-- Micro-interactions Script -->
<script>
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const loginForm = document.getElementById('loginForm');
    const spinner = document.getElementById('spinner');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (loginForm && spinner) {
      loginForm.addEventListener('submit', () => {
        spinner.classList.remove('hidden');
        setTimeout(() => {
          spinner.classList.add('hidden');
        }, 1200);
      });
    }
  </script>
</body></html>
