<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
<title>A2 Registro · Cold Day</title>
<meta name="color-scheme" content="dark">
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Public+Sans:wght@500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "#0b1220",
            surface: "#111b2e",
            "surface-muted": "#0f172a",
            "outline-dim": "#1e293b",
            "outline-active": "#334155",
            primary: "#22d3ee",
            "primary-focus": "#06b6d4",
            "on-primary": "#042f2e",
            danger: "#f87171",
            "danger-muted": "#451a1a",
            "text-muted": "#94a3b8",
            "text-dim": "#94a3b8",
            "text-bright": "#f1f5f9"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            display: ["Space Grotesk", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Space Mono", "monospace"],
            sans: ["Inter", "sans-serif"]
          },
          boxShadow: {
            "cyan-glow": "0 0 16px -2px rgba(34, 211, 238, 0.45)",
          }
        },
      },
    }
  </script>
<style>
    /* iOS Safe Area constraints & touch ergonomics */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      background-color: #050911;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Hide scrollbar for cleanly clamped viewport */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <!-- Cold Day design layer (tokens, foco, tipografía, iconos) -->
<link href="../assets/coldops.css" rel="stylesheet">
<link href="../assets/components.css" rel="stylesheet">
</head>
<body class="bg-[#050911] text-text-bright font-body flex justify-center items-center min-h-screen p-0 sm:p-4 antialiased">
<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><defs><symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2h.01"/></symbol><symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol><symbol id="i-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M13 10h5"/><path d="M13 13.5h3"/></symbol><symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="18" height="8" rx="2"/><path d="M22 11v2"/></symbol><symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></symbol><symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></symbol><symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/></symbol><symbol id="i-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="i-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-4"/><path d="M9.5 20v-8"/><path d="M15 20v-12"/><path d="M20.5 20V4"/></symbol><symbol id="i-snow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15"/><path d="M5.5 8.25l13 7.5"/><path d="M18.5 8.25l-13 7.5"/></symbol><symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9a13 13 0 0 1 17 0"/><path d="M6.5 12.5a9 9 0 0 1 11 0"/><path d="M9.5 16a4.5 4.5 0 0 1 5 0"/><path d="M12 19.5h.01"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol><symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol></defs></svg>
<!-- Mobile Frame Container (Strict 390x844 viewport spec) -->
<main class="w-full max-w-[390px] h-[844px] bg-canvas relative overflow-hidden flex flex-col justify-between border border-outline-dim shadow-2xl sm:rounded-[36px]">
<!-- Top System / Safe Area & Fixed Ionic Header -->
<header class="w-full bg-canvas/95 backdrop-blur-md pt-[calc(env(safe-area-inset-top,10px)+6px)] px-4 pb-2 z-40 border-b border-outline-dim/80 flex-shrink-0">
<!-- Status bar visual anchor -->
<div class="flex justify-between items-center text-[12px] font-label text-text-dim px-1 pb-2">
<span class="font-bold tracking-tight">09:41</span>
<div class="flex items-center gap-1.5">
<svg class="ico ico--13" aria-hidden="true" focusable="false"><use href="#i-signal"/></svg>
<svg class="ico ico--13" aria-hidden="true" focusable="false"><use href="#i-wifi"/></svg>
<svg class="ico ico--14" aria-hidden="true" focusable="false"><use href="#i-battery"/></svg>
</div>
</div>
<!-- Ionic Native Navigation Bar -->
<div class="h-12 flex items-center justify-between">
<!-- Back Button Touch Target (min 44px) -->
<a aria-label="Volver" class="w-11 h-11 -ml-2 rounded-lg flex items-center justify-center text-text-muted hover:text-text-bright active:bg-surface transition-colors" href="#login">
<svg class="ico ico--24" aria-hidden="true" focusable="false"><use href="#i-back"/></svg>
</a>
<!-- Header Title -->
<h1 class="font-headline font-bold text-base tracking-tight text-text-bright text-center">
          Crear cuenta
        </h1>
<!-- Header Right Anchor (Security status indicator) -->
<div class="w-11 h-11 -mr-2 rounded-lg flex items-center justify-center text-text-dim" title="Canal Seguro TLS 1.3">
<svg class="ico ico--20 text-text-dim/80" aria-hidden="true" focusable="false"><use href="#i-shield-check"/></svg>
</div>
</div>
</header>
<!-- Scrollable Body Content -->
<div class="flex-1 overflow-y-auto no-scrollbar px-4 pt-3 pb-3 space-y-4">
<!-- Brand Minimal Status & Segmented Control -->
<div class="space-y-3">
<!-- Cold Day Ops Banner -->
<div class="flex items-center justify-between px-1">
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-md bg-surface flex items-center justify-center border border-outline-dim">
<svg class="ico ico--16 text-primary" aria-hidden="true" focusable="false"><use href="#i-snow"/></svg>
</div>
<span class="font-headline text-xs font-bold tracking-wider uppercase text-text-dim">COLD DAY · OPS AR</span>
</div>
<span class="font-label text-[12px] uppercase text-text-dim bg-surface px-2 py-0.5 rounded border border-outline-dim">FASE REGISTRO</span>
</div>
<!-- Segmented Control / Tabs: Cliente / Técnico / Proveedor -->
<div role="group" aria-label="Tipo de cuenta" class="bg-surface p-1 rounded-xl border border-outline-dim grid grid-cols-3 gap-1">
<!-- Opción 1: Cliente (activa) -->
<button aria-pressed="true" data-tipo class="py-2 text-center rounded-lg bg-outline-dim text-primary border border-primary/30 transition-all" type="button">
<span class="font-headline font-semibold text-xs tracking-tight block">Cliente</span>
<span class="cd-overline text-primary/80">Hogar / Com</span>
</button>
<!-- Opción 2: Técnico (inactiva) -->
<button aria-pressed="false" data-tipo class="py-2 text-center rounded-lg hover:bg-surface-muted text-text-dim hover:text-text-muted transition-all" type="button">
<span class="font-headline font-semibold text-xs tracking-tight block">Técnico</span>
<span class="cd-overline">Matriculado</span>
</button>
<!-- Opción 3: Proveedor (inactiva) -->
<button aria-pressed="false" data-tipo class="py-2 text-center rounded-lg hover:bg-surface-muted text-text-dim hover:text-text-muted transition-all" type="button">
<span class="font-headline font-semibold text-xs tracking-tight block">Proveedor</span>
<span class="cd-overline">Repuestos</span>
</button>
</div>
</div>
<!-- Compact Form Card -->
<form class="bg-surface border border-outline-dim rounded-xl p-3.5 space-y-3 shadow-sm" id="registrationForm" onsubmit="event.preventDefault();">
<!-- Field 1: NOMBRE COMPLETO -->
<div class="space-y-1">
<label class="block font-label text-[12px] uppercase tracking-wider text-text-dim" for="fullname">
            Nombre Completo
          </label>
<div class="relative flex items-center">
<input class="w-full h-11 bg-surface-muted border border-outline-dim rounded-lg px-3 pl-9 text-sm text-text-bright font-body focus:border-primary placeholder:text-text-dim/50" id="fullname" name="fullname" placeholder="Ej. Martín Rossi" type="text" value="Martín Rossi"/>
<svg class="ico ico--20 absolute left-2.5 text-text-dim pointer-events-none" aria-hidden="true" focusable="false"><use href="#i-badge"/></svg>
</div>
</div>
<!-- Field 2: CORREO ELECTRÓNICO (INLINE ERROR STATE SPECIFIED) -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="block font-label text-[12px] uppercase tracking-wider text-danger" for="email">
              Correo Electrónico
            </label>
<span class="font-label text-[12px] text-danger uppercase tracking-tight">Revisa el dato</span>
</div>
<div class="relative flex items-center">
<input aria-describedby="email-error" aria-invalid="true" class="w-full h-11 bg-danger-muted/30 border border-danger rounded-lg px-3 pl-9 pr-9 text-sm text-text-bright font-body focus:border-danger" id="email" name="email" type="email" value="martin.rossi@invalido"/>
<svg class="ico ico--20 absolute left-2.5 text-danger pointer-events-none" aria-hidden="true" focusable="false"><use href="#i-mail"/></svg>
<svg class="ico ico--20 absolute right-2.5 text-danger pointer-events-none" aria-hidden="true" focusable="false"><use href="#i-alert"/></svg>
</div>
<!-- Error helper message -->
<div class="flex items-center gap-1.5 pt-0.5 text-danger" id="email-error">
<svg class="ico ico--16" aria-hidden="true" focusable="false"><use href="#i-alert"/></svg>
<span class="text-xs font-body leading-none">Ingresa un correo válido con dominio activo.</span>
</div>
</div>
<!-- Field 3: CONTRASEÑA -->
<div class="space-y-1">
<label class="block font-label text-[12px] uppercase tracking-wider text-text-dim" for="password">
            Contraseña
          </label>
<div class="relative flex items-center">
<input class="w-full h-11 bg-surface-muted border border-outline-dim rounded-lg px-3 pl-9 pr-11 text-sm text-text-bright font-body tracking-widest focus:border-primary placeholder:tracking-normal placeholder:text-text-dim/50" id="password" name="password" placeholder="Mínimo 8 caracteres" type="password" value="ColdRepairs2024!"/>
<svg class="ico ico--20 absolute left-2.5 text-text-dim pointer-events-none" aria-hidden="true" focusable="false"><use href="#i-lock"/></svg>
<!-- Eye toggle button (touch target) -->
<button aria-pressed="false" aria-label="Mostrar contraseña" class="absolute right-0 h-11 w-11 flex items-center justify-center text-text-muted hover:text-text-bright" id="togglePassword" type="button">
<svg class="ico ico--20" aria-hidden="true" focusable="false"><use href="#i-eye"/></svg>
</button>
</div>
</div>
<!-- Field 4: DIRECCIÓN DE CASA (Contextual to Cliente segment) -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="block font-label text-[12px] uppercase tracking-wider text-text-dim" for="address">
              Dirección de Casa
            </label>
<span class="font-label text-[12px] uppercase tracking-tight text-primary">Bogotá / Cundinamarca</span>
</div>
<div class="relative flex items-center">
<input class="w-full h-11 bg-surface-muted border border-outline-dim rounded-lg px-3 pl-9 text-sm text-text-bright font-body focus:border-primary placeholder:text-text-dim/50" id="address" name="address" placeholder="Calle y altura" type="text" value="Calle 72 #10-34, Bogotá"/>
<svg class="ico ico--20 absolute left-2.5 text-primary pointer-events-none" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg>
</div>
</div>
<!-- Terms & Security Disclaimer -->
<div class="pt-1 border-t border-outline-dim/60 flex items-start gap-2 text-text-dim">
<svg class="ico ico--15 text-text-dim mt-0.5 flex-shrink-0" aria-hidden="true" focusable="false"><use href="#i-shield"/></svg>
<p class="font-label text-[12px] leading-relaxed tracking-tight text-text-dim">
            Tus datos están protegidos · Encriptación TLS 1.3 con almacenamiento bajo normativa AR-PDP.
          </p>
</div>
</form>
</div>
<!-- Bottom Actions / Footer Section (Docked to safe area bottom) -->
<footer class="w-full bg-canvas/95 backdrop-blur-md px-4 pt-2.5 pb-[calc(env(safe-area-inset-bottom,12px)+10px)] border-t border-outline-dim flex-shrink-0 space-y-2">
<!-- Primary Action CTA (Height >= 48px, cyan highlight with restricted glow) -->
<button class="w-full h-12 bg-primary hover:bg-primary-focus active:scale-[0.99] text-on-primary font-headline font-bold text-sm tracking-wide rounded-xl shadow-cyan-glow flex items-center justify-center gap-2 transition-all cursor-pointer" type="button">
<span>Crear cuenta</span>
<svg class="ico ico--20" aria-hidden="true" focusable="false"><use href="#i-arrow-right"/></svg>
</button>
<!-- Secondary Ghost Link (Back to Login, min 44px touch target) -->
<a class="w-full h-11 flex items-center justify-center font-body text-xs text-text-muted hover:text-primary active:opacity-75 transition-colors gap-1" href="#login">
<span>¿Ya tienes cuenta en Cold Day?</span>
<span class="font-semibold text-primary underline underline-offset-2">Ingresa</span>
</a>
<!-- Home Indicator bar emulation for iOS aesthetic -->
<div class="w-32 h-1 bg-outline-dim mx-auto rounded-full mt-1 opacity-70"></div>
</footer>
</main>
<script>
  // Tipo de cuenta: una sola opción activa, estado expuesto.
  document.querySelectorAll('[data-tipo]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-tipo]').forEach(function (o) {
        o.setAttribute('aria-pressed', String(o === btn));
      });
    });
  });

  // Visibilidad de contraseña: estado en aria-pressed, no en un onclick.
  (function () {
    var btn = document.getElementById('togglePassword');
    var campo = document.getElementById('password');
    if (!btn || !campo) return;
    btn.addEventListener('click', function () {
      var oculta = campo.type === 'password';
      campo.type = oculta ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(oculta));
      btn.setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  })();
</script>
</body></html>
